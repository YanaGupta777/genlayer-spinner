<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>GenLayer Intelligent Core Spinner</title>

  <link rel="stylesheet" href="src/spinner.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
      color: #ffffff;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .demo {
      width: min(900px, 100%);
      text-align: center;
    }

    h1 {
      font-size: clamp(30px, 6vw, 52px);
      margin: 0 0 12px;
      letter-spacing: -1px;
    }

    .subtitle {
      color: #aab8ca;
      margin: 0 auto 40px;
      max-width: 650px;
      line-height: 1.6;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .card {
      min-height: 280px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .dark-card {
      background: #050b15;
      border: 1px solid #18324f;
    }

    .light-card {
      background: #f7faff;
      color: #10213b;
    }

    .label {
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 13px;
      font-weight: 700;
      opacity: .75;
    }

    .loader {
      display: grid;
      place-items: center;
      gap: 14px;
    }

    .large-spinner {
      width: 96px;
      height: 96px;
    }

    .loading-text {
      font-size: 14px;
      opacity: .7;
    }

    @media (max-width: 650px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 240px;
      }
    }
  </style>
</head>

<body>

  <main class="demo">

    <h1>GenLayer Intelligent Core Spinner</h1>

    <p class="subtitle">
      A smooth, lightweight and web-ready loading spinner designed
      for GenLayer Portal loading states.
    </p>

    <div class="cards">

      <!-- Dark Theme -->
      <section class="card dark-card">
        <span class="label">Dark Theme</span>

        <div class="loader">

          <svg
            class="gl-spinner gl-spinner--dark large-spinner"
            viewBox="0 0 120 120"
            role="img"
            aria-label="Loading"
          >

            <defs>
              <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#18B6FF"/>
                <stop offset="55%" stop-color="#4D7CFF"/>
                <stop offset="100%" stop-color="#8B5CF6"/>
              </linearGradient>
            </defs>

            <circle
              class="gl-orbit gl-orbit-1"
              cx="60"
              cy="60"
              r="43"
            />

            <circle
              class="gl-orbit gl-orbit-2"
              cx="60"
              cy="60"
              r="34"
            />

            <g class="gl-nodes">
              <circle cx="60" cy="10" r="4"/>
              <circle cx="103" cy="60" r="4"/>
              <circle cx="60" cy="110" r="4"/>
              <circle cx="17" cy="60" r="4"/>
            </g>

            <g class="gl-core">
              <path d="M60 29 L88 78 H32 Z"/>
              <path d="M60 45 L69 62 H51 Z"/>
            </g>

          </svg>

          <span class="loading-text">Loading…</span>

        </div>
      </section>


      <!-- Light Theme -->
      <section class="card light-card">
        <span class="label">Light Theme</span>

        <div class="loader">

          <svg
            class="gl-spinner gl-spinner--light large-spinner"
            viewBox="0 0 120 120"
            role="img"
            aria-label="Loading"
          >

            <defs>
              <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#147CFF"/>
                <stop offset="55%" stop-color="#4D7CFF"/>
                <stop offset="100%" stop-color="#7C3AED"/>
              </linearGradient>
            </defs>

            <circle
              class="gl-orbit gl-orbit-1"
              cx="60"
              cy="60"
              r="43"
            />

            <circle
              class="gl-orbit gl-orbit-2"
              cx="60"
              cy="60"
              r="34"
            />

            <g class="gl-nodes">
              <circle cx="60" cy="10" r="4"/>
              <circle cx="103" cy="60" r="4"/>
              <circle cx="60" cy="110" r="4"/>
              <circle cx="17" cy="60" r="4"/>
            </g>

            <g class="gl-core">
              <path d="M60 29 L88 78 H32 Z"/>
              <path d="M60 45 L69 62 H51 Z"/>
            </g>

          </svg>

          <span class="loading-text">Loading…</span>

        </div>
      </section>

    </div>

  </main>

</body>
</html>
